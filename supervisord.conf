[supervisord]
nodaemon=true
logfile=/dev/null

[program:uvicorn]
command=python /app/api/main.py
directory=/app/api
priority=3
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
killasgroup=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/local/bin/nginx_entrypoint.sh
priority=23
autostart=true
autorestart=true
stopsignal=QUIT

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0