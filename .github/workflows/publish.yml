name: Frontend Build & Docker Push & Release

on:
  push:
    tags:
      - "*"

permissions:
  packages: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1. Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # -------------------------
      # 2. Setup Node
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # -------------------------
      # 3. Install dependencies
      # -------------------------
      - name: Install deps
        run: npm ci

      # -------------------------
      # 4. Build frontend - ONLY ONCE
      # -------------------------
      - name: Build frontend
        run: npm run build

      # -------------------------
      # 5. Package GitHub Release
      # -------------------------
      - name: Package release
        run: |
          mkdir release

          cp -r build/client release/dist
          cp -r api release/api
          cp main.py requirements.txt nginx_entrypoint.sh release/

          tar -czf release.tar.gz release

      # -------------------------
      # 6. Create GitHub Release
      # -------------------------
      - name: Create Release
        if: ${{ !contains(github.ref_name, '-rc') &&
                !contains(github.ref_name, '-beta') &&
                !contains(github.ref_name, '-alpha') &&
                !contains(github.ref_name, '-dev') &&
                !contains(github.ref_name, '-pre') &&
                !contains(github.ref_name, 'preRelease') }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: release.tar.gz
          generate_release_notes: true
          make_latest: true

      # -------------------------
      # 7. Docker setup
      # -------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # -------------------------
      # 8. Login Docker Hub
      # -------------------------
      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------
      # 9. Login GHCR
      # -------------------------
      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # 10. Docker tags
      # -------------------------
      - name: Set Docker tags
        run: |
          TAG=${GITHUB_REF#refs/tags/}

          DOCKERHUB_IMAGE=starstreammm/txt_cleanto_epub
          GHCR_IMAGE=ghcr.io/starstreammm/txt_cleanto_epub

          TAGS="$DOCKERHUB_IMAGE:$TAG,$GHCR_IMAGE:$TAG"

          if [[ "$TAG" =~ -(rc|beta|alpha|dev|pre) ]]; then
            echo "Pre-release detected, not updating latest tag"
          else
            TAGS="$TAGS,$DOCKERHUB_IMAGE:latest,$GHCR_IMAGE:latest"
          fi

          echo "TAGS=$TAGS" >> "$GITHUB_ENV"

      # -------------------------
      # 11. Build & Push Docker
      # -------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.TAGS }}
